name: 🤖 Daily Algo Trading Run

on:
  schedule:
    # 3:45 PM IST = 10:15 UTC (after NSE market close Mon-Fri)
    - cron: '15 10 * * 1-5'
  workflow_dispatch:   # Manual trigger
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'signals'
        type: choice
        options:
          - signals
          - backtest
          - report-only

permissions:
  contents: write

jobs:
  run-trading-bot:
    runs-on: macos-latest
    name: Run Trading Strategies

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📅 Show run info
        run: |
          echo "==================================="
          echo " AlgoTrade India - Daily Run"
          echo " Time: $(date '+%Y-%m-%d %H:%M UTC')"
          echo " Mode: ${{ github.event.inputs.mode || 'signals' }}"
          echo "==================================="

      - name: 🔍 Run trading strategies
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'signals' }}"
          if [ "$MODE" = "backtest" ]; then
            python main.py --backtest
          elif [ "$MODE" = "report-only" ]; then
            python main.py --report-only
          else
            python main.py
          fi

      - name: 📊 Print signal summary
        if: always()
        run: |
          echo "=== Latest Signals ==="
          if [ -f logs/signals.json ]; then
            tail -n 1 logs/signals.json | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          print(f'BUY signals : {data.get(\"n_buy\", 0)}')
          print(f'SELL signals: {data.get(\"n_sell\", 0)}')
          sigs = data.get('signals', [])
          for s in sigs[:10]:
              print(f'  {s.get(\"signal\",\"?\"):4} {s.get(\"ticker\",\"?\")} [{s.get(\"strategy\",\"?\")}]')
          " 2>/dev/null || echo "Could not parse signals"
          else
            echo "No signals file yet"
          fi
          echo ""
          echo "=== Portfolio ==="
          cat logs/performance.json 2>/dev/null || echo "No performance data yet"

      - name: 💾 Commit results to repository
        if: always()
        run: |
          git config user.name "HRaj07"
          git config user.email "2601harshitraj@gmail.com"
          git add logs/ reports/ backtest_results/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Auto: Daily signals $(date '+%Y-%m-%d')"
            git push
            echo "✅ Results committed!"
          fi
